name: 90 - Publicar sitio

# Despliega el tablero a GitHub Pages desde un artefacto de build: sin hacer
# commit y sin rama de datos. Nada entra a git, así que el historial no crece
# con una corrida diaria.
#
# El sitio se arma juntando dos cosas:
#   web/          el tablero (heredado del prototipo, migrado)
#   publico/      los datos que produjo el pipeline diario
#
# Todo queda en el mismo origen, que es lo que necesita un Service Worker
# para funcionar sin conexión en territorio.
#
# REQUISITO DE UNA SOLA VEZ: en Settings -> Pages, poner Source = GitHub Actions.

on:
  workflow_run:
    workflows: ["03 - Monitoreo diario", "04 - Pronóstico de tiempo"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read     # para localizar la ultima corrida exitosa del diario

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    # No publicar si el pipeline falló: mejor dejar el sitio anterior en pie
    # que reemplazarlo por uno sin datos.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      # Los datos vienen del artefacto de la corrida diaria. Cuando este
      # workflow lo disparo el diario, se usa esa corrida; cuando se lanza a
      # mano (p. ej. tras un cambio de CSS), se busca la ultima corrida
      # exitosa del diario. Sin esto, publicar un ajuste visual dejaba el
      # sitio sin datos y obligaba a correr el pipeline completo.
      # El sitio se arma con DOS artefactos de dos workflows distintos:
      # el monitoreo (03) y el pronóstico (04). Cada uno corre a su hora, así
      # que no se puede depender de que el que disparó esta publicación traiga
      # todo. Se busca la última corrida exitosa de cada uno; si esta
      # publicación la disparó una de ellas, se usa esa corrida directamente
      # para evitar la carrera con el índice de GitHub.
      - name: Ubicar las corridas con los datos
        id: origen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPARADOR: ${{ github.event.workflow_run.name }}
          DISPARADOR_ID: ${{ github.event.workflow_run.id }}
        run: |
          ultima() {
            gh run list --workflow "$1" --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty'
          }

          case "$DISPARADOR" in
            *"Monitoreo diario"*) MON="$DISPARADOR_ID" ;;
            *) MON=$(ultima "03-diario.yml") ;;
          esac
          case "$DISPARADOR" in
            *"Pronóstico"*) PRO="$DISPARADOR_ID" ;;
            *) PRO=$(ultima "04-pronostico.yml") ;;
          esac

          echo "run_monitoreo=$MON" >> $GITHUB_OUTPUT
          echo "run_pronostico=$PRO" >> $GITHUB_OUTPUT
          echo "Monitoreo: ${MON:-ninguno} · Pronóstico: ${PRO:-ninguno}"
          if [ -z "$MON" ] && [ -z "$PRO" ]; then
            echo "::warning::Ningún módulo tiene corridas exitosas. El sitio se publicará sin datos."
          fi

      - name: Traer los datos del monitoreo
        if: steps.origen.outputs.run_monitoreo != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: publico
          path: publico
          run-id: ${{ steps.origen.outputs.run_monitoreo }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Van a la MISMA carpeta a propósito: el sitio los sirve juntos, y
      # cada página pide el JSON que le toca.
      - name: Traer los datos del pronóstico
        if: steps.origen.outputs.run_pronostico != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: publico-pronostico
          path: publico
          run-id: ${{ steps.origen.outputs.run_pronostico }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Armar el sitio
        run: |
          mkdir -p sitio
          cp -r web/. sitio/ 2>/dev/null || {
            echo "::error::Falta la carpeta web/ con el tablero."
            exit 1
          }
          if [ -d publico ]; then
            cp -r publico/. sitio/
            echo "Datos incluidos:"
            find sitio -name "*.json" -exec ls -lh {} \;
          else
            echo "::warning::Sin datos: el tablero mostrara el estado vacio. Revisar si el artefacto de la corrida diaria expiro (14 dias de retencion)."
          fi
          # .nojekyll evita que Pages ignore archivos que empiezan con _
          touch sitio/.nojekyll

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: sitio
      - id: desplegar
        uses: actions/deploy-pages@v5

      - name: Dónde quedó
        run: |
          echo "## Sitio publicado" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.desplegar.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
