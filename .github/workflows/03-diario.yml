name: 03 - Monitoreo diario

# Los archivos de GloH2O se publican entre las 01:33 y las 01:38 UTC
# (verificado el 30-09-2026, muy regular). Esta corrida a las 05:00 UTC deja
# 3,5 horas de margen y equivale a medianoche en Colombia, así que el tablero
# amanece actualizado.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      dias:
        description: "Días de ventana"
        required: false
        default: "60"
      seco:
        description: "Modo seco: no escribe en Hugging Face ni publica"
        type: boolean
        required: false
        default: false
      forzar:
        description: "Reprocesar todo, ignorando el registro de ingesta"
        type: boolean
        required: false
        default: false

# Una sola corrida a la vez: dos escrituras simultáneas en el dataset se
# pisarían.
concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  monitoreo:
    # ubuntu-latest migra a Ubuntu 26 desde el 19 de octubre de 2026. El
    # pipeline es Python puro instalado por pip, así que el riesgo es bajo y
    # se prefiere flotar antes que anclar una imagen que GitHub retirará.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install --quiet -r requirements.txt

      - name: Ejecutar pipeline
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/diario.py \
            --dias "${{ github.event.inputs.dias || '60' }}" \
            ${{ github.event.inputs.seco == 'true' && '--seco' || '' }} \
            ${{ github.event.inputs.forzar == 'true' && '--forzar' || '' }}

      - name: Guardar lo publicado
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publico
          path: publico/
          retention-days: 14
          if-no-files-found: ignore
