# Fuentes de datos del pipeline
#
# IDs descubiertos por scripts/explorar_drive.py el 30-09-2026.
# Si GloH2O reorganiza sus carpetas, volver a correr ese workflow.
#
# Las carpetas de GloH2O están compartidas como "cualquiera con el enlace",
# así que la cuenta de servicio puede leerlas sin permiso explícito.
# Se accede SIEMPRE por ID, nunca navegando por nombres de ruta.

meta:
  descubierto: 2026-09-30
  script: scripts/explorar_drive.py
  licencia: CC BY-NC 4.0 (MSWEP y MSWX, GloH2O)
  convencion_nombres: "AAAADDD.nc — año + día juliano (2026271.nc = 28-sep-2026)"

# ---------------------------------------------------------------------------
# Destino de los datos
# ---------------------------------------------------------------------------
# La jerarquia es POR MODULO en el primer nivel, para que al abrir el dataset
# se entienda de un vistazo que hay en cada carpeta:
#
#   monitoreo/   lo que ya paso. Reescribible: si hay que recalcular, se
#                regenera el mes, porque el dato se puede volver a descargar.
#   pronostico/  lo que se anuncio. INMUTABLE: un pronostico emitido no se
#                puede volver a obtener de ninguna parte.
#   indices/     contexto global (ONI). No es de nuestros municipios ni es
#                pronostico; es el marco en el que se leen los otros dos.
#   derivado/    se recalcula desde los anteriores. Se puede borrar.
#   estado/      interno del pipeline. Borrarlo no pierde datos, pero obliga
#                a reprocesar.

almacenamiento:
  repo: pmaclimafap/monitoreo-nino-colombia
  tipo: dataset

  rutas:
    # --- Modulo 1: monitoreo ---
    monitoreo_puntos: "monitoreo/satelital/puntos/{anio}-{mes:02d}.parquet"
    monitoreo_grilla: "monitoreo/satelital/grilla/{anio}-{mes:02d}.parquet"
    # monitoreo/comunitario/ queda reservado para los pluviometros y
    # termohigrometros de los grupos motores.

    # --- Modulo 2: pronostico ---
    # Un archivo por FECHA DE EMISION, no por mes: si una escritura falla,
    # se pierde un dia en lugar de un mes de historia irrecuperable.
    pronostico_diario: "pronostico/diario/{anio}/{fecha}.parquet"
    pronostico_estacional: "pronostico/estacional/{anio}/{anio}-{mes:02d}.parquet"

    # --- Contexto ---
    oni: "indices/oni.parquet"

    # --- Derivado: recalculable, se puede borrar ---
    verificacion: "derivado/verificacion/{anio}.parquet"

    # --- Interno del pipeline ---
    ingesta: "estado/ingesta.parquet"
    bitacora: "estado/bitacora.parquet"

# ---------------------------------------------------------------------------
# Ventana de revisión del tiempo casi real
# ---------------------------------------------------------------------------
# GloH2O: los archivos MSWEP-NRT con menos de 10 días se actualizan
# progresivamente. El pipeline debe recomprobar la fecha de modificación en
# origen dentro de esta ventana, no dar por bueno un archivo solo porque ya
# existe.
nrt:
  dias_reverificacion: 10
  madurez:
    preliminar: [0, 1]     # GSMaP NRT, IMERG Early, GDAS
    intermedio: [2, 5]     # GSMaP Standard, IMERG Late
    consolidado: [6, null] # ERA5 reemplaza a GDAS

# ---------------------------------------------------------------------------
# Variables en uso
# ---------------------------------------------------------------------------
variables:

  precipitacion:
    unidad: mm/d
    # Nombres internos posibles de la variable dentro del .nc.
    # Se prueban en orden; cada producto la nombra distinto.
    candidatos: [precipitation, precip, P, pr]
    fuente: mswep_nrt_daily
    respaldo: [mswx_nrt_p_daily, chirps]

  temperatura:
    unidad: °C
    candidatos: [air_temperature, temperature, Temp, tas, T]
    fuente: mswx_nrt_temp_daily
    respaldo: [open_meteo]

  tmax:
    unidad: °C
    candidatos: [air_temperature, temperature, Tmax, tasmax]
    fuente: mswx_nrt_tmax_daily
    respaldo: [open_meteo]

  tmin:
    unidad: °C
    candidatos: [air_temperature, temperature, Tmin, tasmin]
    fuente: mswx_nrt_tmin_daily
    respaldo: [open_meteo]

  humedad_relativa:
    unidad: "%"
    candidatos: [relative_humidity, RelHum, rh, hurs]
    fuente: mswx_nrt_relhum_daily
    respaldo: [open_meteo]

# ---------------------------------------------------------------------------
# Carpetas de Drive en uso
# ---------------------------------------------------------------------------
carpetas:

  # --- Tiempo casi real: alimenta la ventana de monitoreo ---
  mswep_nrt_daily:
    ruta: MSWEP_V280/NRT/Daily
    id: 1aehP6YDNOO73ab3tvTZet2Sh5uPdG9I_
  mswx_nrt_temp_daily:
    ruta: MSWX_V100/NRT/Temp/Daily
    id: 1cVIEwv9U4nwCxJxbU99Qx0izidKyDgKi
  mswx_nrt_tmax_daily:
    ruta: MSWX_V100/NRT/Tmax/Daily
    id: 189X3z8IRGABcXYhMFYXaJPd4ftwKE7qm
  mswx_nrt_tmin_daily:
    ruta: MSWX_V100/NRT/Tmin/Daily
    id: 1ZQreWvmT1yF19e6Yl4pHWqKifRUiDk6E
  mswx_nrt_relhum_daily:
    ruta: MSWX_V100/NRT/RelHum/Daily
    id: 1XTvdDjtFOrJbG69ExtdBP1-7lPs4EyCL

  # --- Histórico: carga inicial y control cruzado ---
  # MSWEP/Past incorpora la corrección por pluviómetros; NRT todavía no la
  # tiene consolidada en sus primeros días.
  mswep_past_daily:
    ruta: MSWEP_V280/Past/Daily
    id: 1gWoZ2bK2u5osJ8Iw-dvguZ56Kmz2QWrL
  mswx_past_tmax_daily:
    ruta: MSWX_V100/Past/Tmax/Daily
    id: 1BKvHhO1JsBKKzMPCbzl5UpvqpRXHTj9c
  mswx_past_tmin_daily:
    ruta: MSWX_V100/Past/Tmin/Daily
    id: 1_h0hgJThJLXhVOk905IJ7EFpkFV5KDSC
  mswx_past_relhum_daily:
    ruta: MSWX_V100/Past/RelHum/Daily
    id: 1EcBx7pdD23P7G2V8-HDrk0Sr7uJm9uvc

  # --- Control cruzado de precipitación ---
  # MSWX trae su propia estimación de lluvia, independiente de MSWEP.
  # Dos estimaciones para el mismo punto y día, sin costo adicional.
  mswx_nrt_p_daily:
    ruta: MSWX_V100/NRT/P/Daily
    id: 1ylMZaQDjAkn9WHubiVQFAYp9t0SbAavx

  # --- Sin corrección por pluviómetros: para evaluar el aporte de la
  #     corrección en los municipios del proyecto ---
  mswep_past_nogauge_daily:
    ruta: MSWEP_V280/Past_nogauge/Daily
    id: 1EDmRUu5rZyo-0eQ0dDild1A8i6GkcBFu

