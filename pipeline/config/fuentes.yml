# ---------------------------------------------------------------------------
# Ramas de pronóstico de MSWX
# ---------------------------------------------------------------------------
# NO se recorren con el explorador: una carpeta por fecha de inicialización y
# otra por miembro del ensamble suman decenas de miles.
#
# Estructura:
#   Mid/<Variable>/<AAAAMMDD_HH>/<miembro 01-30>/{Daily,3hourly}
#
# Inicializaciones observadas: desde 20000101_00 hasta el día actual.
# Los retropronósticos desde el año 2000 permiten evaluar habilidad predictiva
# sin esperar años de operación. Relevante para el módulo de pronóstico.
pronostico_mswx:
  mid:
    descripcion: Ensamble de mediano plazo, 30 miembros, hasta 10 días (GEFS)
    patron_ruta: "MSWX_V100/Mid/{variable}/{AAAAMMDD}_00/{miembro}/Daily"
    miembros: [1, 30]
  long:
    descripcion: Ensamble de largo plazo, 51 miembros, hasta 7 meses (SEAS5)
    id: 1CYSEQS-M6687HBYVnb1Y9uLIO-PDoo7Q
    nota: >
      La exploración lo reportó sin subcarpetas, lo que no cuadra con la
      documentación. Verificar manualmente antes de usarlo.
