# Umbrales e indicadores
#
# Este archivo es DATO, no código. Se edita a mano y se congela: cualquier
# indicador publicado debe ser reproducible, y si un umbral cambia tiene que
# verse en el historial de este archivo, no enterrado en un script.
#
# LOS UMBRALES SE DEFINEN CON CONOCIMIENTO LOCAL, no estadísticamente.
# Un percentil dice si un día fue inusual para el lugar; un umbral agronómico
# dice si ese día le hizo daño al cultivo o al animal. Para activar medidas
# anticipatorias sirve lo segundo.

meta:
  version: 0
  actualizado: 2026-09-30
  estado: >
    Valores de partida, pendientes de definición con los técnicos en
    territorio. El campo `origen` indica de dónde salió cada uno:
      heredado  - venía del tablero prototipo, marcado allí como ejemplo
      propuesto - lo agregamos porque el sistema productivo faltaba
      local     - definido con los técnicos o las asociaciones  <-- objetivo
    Al validar un valor, cambiar `origen` a `local` y llenar `fuente`.

# ---------------------------------------------------------------------------
# Umbrales por sistema productivo
# ---------------------------------------------------------------------------
# tmax             °C. Por encima de este valor el día cuenta como de calor.
# humedad_relativa %. Por encima, día de humedad alta.
# usar_ith         Sistemas pecuarios: además se evalúa el índice combinado.
# municipios       Dónde aplica, según las asociaciones del proyecto.
# fuente           Quién validó el valor y con qué criterio. Llenar.

sistemas_productivos:

  # === Sistemas presentes en las asociaciones del proyecto ===

  cafe:
    tmax: 28
    humedad_relativa: 75
    origen: heredado
    fuente: null
    municipios: [icononzo, planadas, fonseca]
    nota: HR alta se asocia a incidencia de roya.

  yuca:
    tmax: 34
    humedad_relativa: 83
    origen: heredado
    fuente: null
    municipios: [san_jose_de_toluviejo]

  ganaderia:
    tmax: 33
    humedad_relativa: 80
    origen: heredado
    fuente: null
    usar_ith: true
    municipios: [fonseca, el_paso]

  maiz:
    tmax: 33
    humedad_relativa: 80
    origen: heredado
    fuente: null
    municipios: [fonseca]

  porcicultura:
    tmax: 30
    humedad_relativa: 80
    origen: propuesto
    fuente: null
    usar_ith: true
    municipios: [los_palmitos, san_jose_de_toluviejo, manaure]
    nota: >
      Los cerdos no sudan y son muy sensibles al estrés calórico. Los talleres
      reportaron enfermedades y agresividad entre animales por altas
      temperaturas. Valor a validar con zootecnista.

  gallinas_ponedoras:
    tmax: 30
    humedad_relativa: 75
    origen: propuesto
    fuente: null
    usar_ith: true
    municipios: [el_paso]
    nota: >
      ASOINREPA reportó pérdida del 20 % de la producción de huevos por altas
      temperaturas en 2026. Ese dato permite calibrar el umbral contra un
      efecto observado.

  cacao:
    tmax: 32
    humedad_relativa: 80
    origen: propuesto
    fuente: null
    municipios: [manaure]

  aguacate:
    tmax: 33
    humedad_relativa: 80
    origen: propuesto
    fuente: null
    municipios: [planadas]
    nota: >
      ASPROAGROPE reporta afectación por exceso de humedad y lluvias
      torrenciales, no por sequía. Conviene un indicador de encharcamiento
      además del de calor.

  frutales:
    tmax: 33
    humedad_relativa: 80
    origen: propuesto
    fuente: null
    municipios: [manaure]

  maderables:
    tmax: 34
    humedad_relativa: 80
    origen: propuesto
    fuente: null
    municipios: [manaure]

  especies_menores:
    tmax: 31
    humedad_relativa: 80
    origen: propuesto
    fuente: null
    usar_ith: true
    municipios: [fonseca]

  procesamiento_agroalimentario:
    tmax: 33
    humedad_relativa: 80
    origen: propuesto
    fuente: null
    municipios: [san_jose_de_toluviejo]
    nota: >
      No es un cultivo. La sensibilidad de ASOCOMAN es a cortes de energía y a
      fallas térmicas del deshidratador durante olas de calor.

  # === Del prototipo, sin asociación vinculada ===
  # Se conservan porque el tablero deja escoger cultivo por departamento.
  arroz:            {tmax: 35, humedad_relativa: 85, origen: heredado, fuente: null}
  algodon:          {tmax: 36, humedad_relativa: 78, origen: heredado, fuente: null}
  palma_de_aceite:  {tmax: 36, humedad_relativa: 88, origen: heredado, fuente: null}
  ajonjoli:         {tmax: 33, humedad_relativa: 78, origen: heredado, fuente: null}
  name:             {tmax: 32, humedad_relativa: 82, origen: heredado, fuente: null}
  soya:             {tmax: 32, humedad_relativa: 80, origen: heredado, fuente: null}
  cebolla_de_bulbo: {tmax: 30, humedad_relativa: 80, origen: heredado, fuente: null}
  frijol:           {tmax: 30, humedad_relativa: 80, origen: heredado, fuente: null}
  pancoger:         {tmax: 33, humedad_relativa: 82, origen: heredado, fuente: null}

# ---------------------------------------------------------------------------
# Indicadores de temperatura
# ---------------------------------------------------------------------------

temperatura:
  # Tres o más días consecutivos por encima del umbral del sistema productivo.
  #
  # NOTA: el Reporte 1 (sección 1.2) define la ola de calor contra el P80
  # climatológico local. Aquí se define contra el umbral absoluto del cultivo.
  # Son dos definiciones distintas y NO son comparables:
  #   P80      -> "¿fue un día inusual PARA ESTE LUGAR?"
  #   absoluto -> "¿le hizo daño A ESTE SISTEMA PRODUCTIVO?"
  # Para activar medidas anticipatorias sirve la segunda. No mezclarlas en una
  # misma figura ni en un mismo texto.
  dias_consecutivos_ola_calor: 3

  # Amplitud térmica diaria (Tmax - Tmin) por debajo de la cual se marca el
  # dato como sospechoso. MSWX subestima Tmax y sobrestima Tmin, así que
  # comprime la amplitud; en la prueba del 30-09-2026 se observaron valores
  # de 0,3 a 8 °C en zonas donde se esperarían 8 a 12 °C.
  amplitud_minima_esperada: 2.0

# ---------------------------------------------------------------------------
# Control de calidad
# ---------------------------------------------------------------------------
# MSWX corrige el sesgo de cada variable por separado, así que la coherencia
# entre ellas no está garantizada. En la prueba del 30-09-2026 se detectó
# Tmax < Temp en Manaure (26-sep). Estos casos se MARCAN, no se descartan en
# silencio ni se corrigen.

control_calidad:
  exigir_tmin_menor_igual_temp_menor_igual_tmax: true
  marcar_amplitud_baja: true
  rango_valido:
    tmax: [-10, 55]
    tmin: [-20, 40]
    temperatura: [-15, 50]
    humedad_relativa: [0, 100]
    precipitacion: [0, 500]

# ---------------------------------------------------------------------------
# Índice de temperatura y humedad (ITH)
# ---------------------------------------------------------------------------
# Para sistemas pecuarios, evaluar temperatura y humedad por separado es
# engañoso: 33 °C con 60 % de HR y 33 °C con 85 % son situaciones muy
# distintas para un animal, porque la humedad impide disipar calor.
#
# Se aplica a los sistemas marcados con usar_ith: true.
# PENDIENTE: validar formulación y cortes con un zootecnista.

ith:
  formula: "(1.8 * T + 32) - (0.55 - 0.0055 * HR) * (1.8 * T - 26)"
  variables: {T: tmax, HR: humedad_relativa}
  estado: propuesto_sin_validar
  categorias:
    normal:     [null, 74]
    alerta:     [75, 78]
    peligro:    [79, 83]
    emergencia: [84, null]

# ---------------------------------------------------------------------------
# Indicadores de precipitación
# ---------------------------------------------------------------------------

precipitacion:
  dia_con_lluvia_mm: 1.0   # >= 1 mm cuenta como día con lluvia

  # Umbrales de lluvia ACUMULADA por duración del período. Un acumulado
  # "fuerte" en un día es mucho menor que uno "fuerte" en un mes, así que
  # cada ventana tiene su propia escala.
  # origen: heredado del prototipo, referencia diaria IDEAM escalada.
  acumulado_mm:
    1:  {seco: 1,  moderada: 15,  fuerte: 40}
    7:  {seco: 5,  moderada: 50,  fuerte: 100}
    14: {seco: 10, moderada: 90,  fuerte: 180}
    30: {seco: 15, moderada: 150, fuerte: 300}

# ---------------------------------------------------------------------------
# Ventanas de agregación
# ---------------------------------------------------------------------------
# Corresponden a "qué sucedió ayer, -1 sem, -2 sem" del diseño original.

ventanas:
  ultima_fecha: 1
  ultima_semana: 7
  ultimas_2_semanas: 14
  ultimo_mes: 30
